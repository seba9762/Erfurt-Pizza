<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Zugang - Erfurt Pizza</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .lock-icon {
            font-size: 48px;
            color: #dc2626;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .toggle-password {
            cursor: pointer;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #dc2626;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee2e2;
            border: 2px solid #fecaca;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .info-box {
            background: #dbeafe;
            border: 2px solid #bfdbfe;
            color: #1e40af;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            font-size: 13px;
            text-align: left;
        }

        .info-box strong {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .info-box ul {
            list-style: none;
            padding-left: 0;
        }

        .info-box li {
            margin: 5px 0;
            padding-left: 20px;
            position: relative;
        }

        .info-box li:before {
            content: "✓";
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .back-link {
            margin-top: 20px;
            display: inline-block;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #dc2626;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🍕</div>
        <h1>Admin Bereich</h1>
        <p class="subtitle">Erfurt Pizza - Bestellverwaltung</p>

        <div class="lock-icon">
            <i class="fas fa-lock"></i>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i> Falsches Passwort. Bitte versuchen Sie es erneut.
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="password">Passwort</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Geben Sie Ihr Passwort ein"
                        autocomplete="current-password"
                        required
                    >
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i>
                Anmelden
            </button>
        </form>

        <div class="info-box">
            <strong><i class="fas fa-shield-alt"></i> Sicherheitshinweis:</strong>
            <ul>
                <li>Passwort nach dem ersten Login ändern</li>
                <li>Nicht auf öffentlichen Computern anmelden</li>
                <li>Immer abmelden nach der Nutzung</li>
            </ul>
        </div>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Zurück zur Website
        </a>
    </div>

    <script>
        // IMPORTANT: Change this password hash after first login!
        // To generate a new password hash, use the helper function at the bottom of this file
        // Current password: "erfurt2024" (CHANGE THIS IMMEDIATELY!)
        const ADMIN_PASSWORD_HASH = '8f6e0b9c5e4d3a2b1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6';

        // Check if already authenticated
        if (sessionStorage.getItem('adminAuthenticated') === 'true') {
            window.location.href = 'orders-dashboard.html';
        }

        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const errorMessage = document.getElementById('errorMessage');

        // Toggle password visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        // Simple hash function (SHA-256 equivalent for client-side)
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // Handle login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value;
            const hashedPassword = await hashPassword(password);

            if (hashedPassword === ADMIN_PASSWORD_HASH) {
                // Authentication successful
                sessionStorage.setItem('adminAuthenticated', 'true');
                sessionStorage.setItem('adminLoginTime', new Date().toISOString());

                // Redirect to dashboard
                window.location.href = 'orders-dashboard.html';
            } else {
                // Authentication failed
                errorMessage.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();

                // Hide error after 3 seconds
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        });

        // Auto-focus password field
        passwordInput.focus();

        /*
         * PASSWORD CHANGE HELPER
         * =====================
         * To change your password:
         * 1. Open browser console (F12)
         * 2. Run: generatePasswordHash("YourNewPassword")
         * 3. Copy the hash that appears
         * 4. Replace ADMIN_PASSWORD_HASH above with the new hash
         * 5. Save this file
         */
        async function generatePasswordHash(newPassword) {
            const encoder = new TextEncoder();
            const data = encoder.encode(newPassword);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            console.log('='.repeat(60));
            console.log('Your new password hash:');
            console.log(hashHex);
            console.log('='.repeat(60));
            console.log('Replace ADMIN_PASSWORD_HASH in orders.html with this hash');
            return hashHex;
        }

        // Make function globally available for console use
        window.generatePasswordHash = generatePasswordHash;
    </script>
</body>
</html>
