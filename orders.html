<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Zugang - Erfurt Pizza</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .lock-icon {
            font-size: 48px;
            color: #dc2626;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .toggle-password {
            cursor: pointer;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #dc2626;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee2e2;
            border: 2px solid #fecaca;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .info-box {
            background: #dbeafe;
            border: 2px solid #bfdbfe;
            color: #1e40af;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            font-size: 13px;
            text-align: left;
        }

        .info-box strong {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .info-box ul {
            list-style: none;
            padding-left: 0;
        }

        .info-box li {
            margin: 5px 0;
            padding-left: 20px;
            position: relative;
        }

        .info-box li:before {
            content: "✓";
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .back-link {
            margin-top: 20px;
            display: inline-block;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #dc2626;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🍕</div>
        <h1>Admin Bereich</h1>
        <p class="subtitle">Erfurt Pizza - Bestellverwaltung</p>

        <div class="lock-icon">
            <i class="fas fa-lock"></i>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i> Falsches Passwort. Bitte versuchen Sie es erneut.
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="password">Passwort</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Geben Sie Ihr Passwort ein"
                        autocomplete="current-password"
                        required
                    >
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i>
                Anmelden
            </button>
        </form>

        <div class="info-box">
            <strong><i class="fas fa-shield-alt"></i> Sicherheitshinweis:</strong>
            <ul>
                <li>Passwort nach dem ersten Login ändern</li>
                <li>Nicht auf öffentlichen Computern anmelden</li>
                <li>Immer abmelden nach der Nutzung</li>
            </ul>
        </div>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Zurück zur Website
        </a>
    </div>

    <script>
        // Check if already authenticated (has valid token)
        const token = sessionStorage.getItem('adminToken');
        const tokenExpiry = sessionStorage.getItem('adminTokenExpiry');

        if (token && tokenExpiry && new Date(tokenExpiry) > new Date()) {
            // Token still valid, redirect to dashboard
            window.location.href = 'orders-dashboard.html';
        }

        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const errorMessage = document.getElementById('errorMessage');

        // Toggle password visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        // Handle login via backend authentication
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value;

            // Disable submit button during request
            const submitButton = loginForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authentifizierung...';

            try {
                // Call backend authentication function
                const response = await fetch('/.netlify/functions/admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Authentication successful
                    sessionStorage.setItem('adminToken', data.token);

                    // Calculate expiry time (8 hours from now)
                    const expiryTime = new Date();
                    expiryTime.setSeconds(expiryTime.getSeconds() + data.expiresIn);
                    sessionStorage.setItem('adminTokenExpiry', expiryTime.toISOString());

                    // Redirect to dashboard
                    window.location.href = 'orders-dashboard.html';
                } else {
                    // Authentication failed
                    errorMessage.textContent = data.error || 'Falsches Passwort. Bitte versuchen Sie es erneut.';
                    errorMessage.classList.add('show');
                    passwordInput.value = '';
                    passwordInput.focus();

                    // Re-enable submit button
                    submitButton.disabled = false;
                    submitButton.innerHTML = '<i class="fas fa-sign-in-alt"></i> Anmelden';

                    // Hide error after 3 seconds
                    setTimeout(() => {
                        errorMessage.classList.remove('show');
                    }, 3000);
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Verbindungsfehler. Bitte versuchen Sie es erneut.';
                errorMessage.classList.add('show');

                // Re-enable submit button
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fas fa-sign-in-alt"></i> Anmelden';

                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        });

        // Auto-focus password field
        passwordInput.focus();

        /*
         * PASSWORD CHANGE HELPER
         * =====================
         * To change your password:
         * 1. Generate a SHA-256 hash of your new password using an online tool:
         *    https://emn178.github.io/online-tools/sha256.html
         * 2. Add the hash to your Netlify environment variables as ADMIN_PASSWORD_HASH
         * 3. Also set JWT_SECRET to a random string (32+ characters recommended)
         *
         * Example:
         * ADMIN_PASSWORD_HASH=<your-sha256-hash>
         * JWT_SECRET=<random-32-character-string>
         */
    </script>
</body>
</html>
